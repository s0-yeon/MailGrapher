<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:* https://api.example.com https://*.googleapis.com; frame-src 'self' https://mail.google.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.svg" sizes="180x180">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="rgb(42, 63, 84)">
    <title>Search | Olive</title>
    <script type="module" src="/src/pages/search.js"></script>
    <!-- 헤더 로고(.gw-brand-logo-text)가 Instrument Serif를 쓰는데 이 페이지엔 없어서
         Georgia/기본 serif로 폴백되며 홈 화면이랑 다르게(더 좁게) 보이던 것을 통일 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@0,0,9..144,100..900&display=block" rel="stylesheet">
  </head>

  <body class="page-search">
    <div class="container body">
      <div class="main_container">

        <div id="app-header"></div>

        <!-- Page Content -->
        <main class="right_col" role="main" aria-label="Main content" style="padding: 0;">

          <!-- ═══ 검색 패널 ═══ -->
          <div id="panel-search">
            <div class="gw-search-top">
              <div class="gw-search-box">
                <input type="text" id="search-input" placeholder="메일에 대해 궁금한 것을 검색하세요..." autocomplete="off">
                <button id="search-btn" type="button">
                  <i class="fas fa-search"></i>
                </button>
              </div>
              <div class="gw-recent-searches" id="recent-searches-bar" style="display:none;">
                <span class="gw-recent-label"><i class="fas fa-history me-1"></i>최근 검색:</span>
                <div id="recent-tags"></div>
                <span class="gw-recent-clear" id="clear-recent">전체 삭제</span>
              </div>
            </div>
            <div class="gw-result-wrapper">
              <div id="result-container">
                <div class="gw-empty">
                  <i class="bi bi-search"></i>
                  <p>검색어를 입력해 메일을 분석하세요.</p>
                </div>
              </div>
            </div>
          </div>

        </main>
        <!-- /Page Content -->

        <footer id="app-footer"></footer>

      </div>
    </div>

  </body>
</html>
