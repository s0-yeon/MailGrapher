<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:* https://*.ngrok-free.dev https://*.ngrok-free.app https://*.ngrok.io; frame-src 'none'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.svg" sizes="180x180">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="rgb(42, 63, 84)">
    <title>메일 수집 | Olive</title>
    <script type="module" src="/src/pages/imap-collect.js"></script>
  </head>

  <body class="page-imap-collect">
    <div class="container body">
      <div class="main_container">

        <div id="app-header"></div>

        <!-- Page Content -->
        <main class="right_col" role="main" aria-label="Main content">
          <div class="gw-collect-wrap">

            <div class="gw-page-title">
              <i class="bi bi-inbox-fill"></i>
              메일 수집
            </div>
            <p class="gw-page-subtitle">IMAP으로 메일 서버에 연결해 메일을 가져옵니다. 수집된 메일은 GraphRAG 인덱싱에 사용됩니다.</p>

            <!-- ── 카드 1: IMAP 서버 설정 ── -->
            <div class="gw-card">
              <div class="gw-card-title">
                <i class="bi bi-server"></i>
                서버 설정
              </div>

              <!-- 프리셋 -->
              <div class="gw-presets">
                <div class="gw-preset-chip active" data-host="imap.gmail.com" data-port="993" data-domain="gmail.com">
                  <i class="bi bi-google"></i> Gmail
                </div>
                <div class="gw-preset-chip" data-host="imap.naver.com" data-port="993" data-domain="naver.com">
                  <i class="bi bi-envelope"></i> 네이버
                </div>
                <div class="gw-preset-chip" data-host="imap.mail.me.com" data-port="993" data-domain="icloud.com">
                  <i class="bi bi-apple"></i> iCloud
                </div>
                <div class="gw-preset-chip" data-host="" data-port="993" data-domain="">
                  <i class="bi bi-gear"></i> 직접 입력
                </div>
              </div>

              <div class="gw-form-grid cols-3">
                <div class="gw-form-group">
                  <label class="gw-label">IMAP 호스트</label>
                  <input id="imap-host" class="gw-input" type="text" value="imap.gmail.com" placeholder="imap.example.com">
                </div>
                <div class="gw-form-group">
                  <label class="gw-label">포트</label>
                  <input id="imap-port" class="gw-input" type="number" value="993" placeholder="993">
                </div>
                <div class="gw-form-group">
                  <label class="gw-label">SSL</label>
                  <select id="imap-ssl" class="gw-select">
                    <option value="true" selected>사용 (993)</option>
                    <option value="false">미사용 (143)</option>
                  </select>
                </div>
                <div class="gw-form-group">
                  <label class="gw-label">이메일 주소</label>
                  <input id="imap-user" class="gw-input" type="text" placeholder="you@example.com" value="@gmail.com">
                </div>
                <div class="gw-form-group">
                  <label class="gw-label">앱 비밀번호</label>
                  <input id="imap-pass" class="gw-input" type="password" placeholder="앱 전용 비밀번호">
                </div>
              </div>

              <div style="margin-top:16px;display:flex;align-items:center;gap:12px;">
                <button type="button" class="gw-preset-chip" id="list-folders-btn" style="cursor:pointer;">
                  <i class="bi bi-arrow-clockwise"></i> 폴더 불러오기
                </button>
                <span id="folder-list-hint" style="font-size:0.8rem;color:#73879C;"></span>
              </div>
            </div>

            <!-- ── 카드 2: 수집 옵션 ── -->
            <div class="gw-card">
              <div class="gw-card-title">
                <i class="bi bi-sliders"></i>
                수집 옵션
              </div>

              <!-- 폴더 선택 ("폴더 불러오기" 버튼으로 동적으로 채워짐) -->
              <div class="gw-form-group" style="margin-bottom:18px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
                  <label class="gw-label" style="margin-bottom:0;">수집 폴더</label>
                  <button type="button" class="gw-select-all-btn" id="select-all-btn" style="display:none;">전체 선택</button>
                </div>
                <div class="gw-folder-list" id="folder-list">
                  <span class="gw-folder-empty">"폴더 불러오기"를 눌러 수집할 폴더를 선택하세요.</span>
                </div>
              </div>

              <div class="gw-form-grid">
                <div class="gw-form-group">
                  <label class="gw-label">수집 개수 (폴더당)</label>
                  <select id="collect-limit" class="gw-select">
                    <option value="50">50개</option>
                    <option value="100">100개</option>
                    <option value="200">200개</option>
                    <option value="500">500개</option>
                    <option value="0" selected>전체</option>
                    <option value="custom">사용자 지정</option>
                  </select>
                  <input type="number" id="collect-limit-custom" class="gw-input" placeholder="개수 입력" min="1" style="display:none; margin-top:8px;">
                </div>
                <div class="gw-form-group">
                  <label class="gw-label">동기 모드</label>
                  <select id="sync-mode" class="gw-select">
                    <option value="append" selected>증분 (새 메일만)</option>
                    <option value="rewrite">전체 재수집</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- ── 수집 버튼 ── -->
            <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
              <button class="gw-collect-btn" id="collect-btn">
                <div class="gw-spinner" id="collect-spinner"></div>
                <i class="bi bi-download" id="collect-icon"></i>
                메일 수집 시작
              </button>
              <span id="collect-hint" style="font-size:0.82rem;color:#73879C;"></span>
            </div>

            <!-- ── 진행상황 패널 ── -->
            <div class="gw-log-panel" id="log-panel">
              <div class="gw-log-header">
                <div class="gw-log-header-left">
                  <i class="bi bi-terminal" style="color:#26B99A;"></i>
                  수집 로그
                </div>
                <div class="gw-status-badge idle" id="log-status-badge">
                  <span class="gw-status-dot" id="log-status-dot"></span>
                  <span id="log-status-text">대기 중</span>
                </div>
              </div>
              <div class="gw-progress-bar-wrap">
                <div class="gw-progress-bar-fill" id="log-progress-bar"></div>
              </div>
              <div class="gw-log-body" id="log-body">
                <div class="gw-log-empty" id="log-empty">
                  <i class="bi bi-clock-history" style="font-size:1.2rem;"></i>
                  수집을 시작하면 여기에 로그가 표시됩니다.
                </div>
              </div>

              <!-- 결과 요약 -->
              <div class="gw-result-row" id="result-row" style="display:none;">
                <div class="gw-result-chip">
                  <i class="bi bi-envelope-check"></i>
                  <strong id="result-added">0</strong>
                  <span>개 수집</span>
                </div>
                <div class="gw-result-chip">
                  <i class="bi bi-skip-forward"></i>
                  <strong id="result-skipped">0</strong>
                  <span>개 중복 스킵</span>
                </div>
                <a class="gw-collect-btn" href="/dashboard/" style="padding:8px 20px;font-size:0.85rem;box-shadow:none;text-decoration:none;">
                  <i class="bi bi-arrow-right-circle"></i>
                  대시보드로 이동
                </a>
              </div>
            </div>

          </div><!-- /.gw-collect-wrap -->
        </main>
        <!-- /Page Content -->

        <footer id="app-footer"></footer>

      </div>
    </div>

  </body>
</html>
